[project]
name = "markdown-rag"
version = "0.1.0"
description = "Local RAG over a folder of markdown in one command. Qdrant + sentence-transformers + Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandar Chapkanov" }]
dependencies = [
    "anthropic>=0.107",
    "qdrant-client>=1.13,<2",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
